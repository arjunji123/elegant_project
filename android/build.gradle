buildscript {
    ext {
        buildToolsVersion   = "35.0.0"
        minSdkVersion       = 24
        compileSdkVersion   = 35
        targetSdkVersion    = 35
        ndkVersion          = "27.1.12297006"
        kotlinVersion       = "1.9.24"
        hermesEnabled       = true
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Specify explicit plugin versions
        classpath("com.android.tools.build:gradle:8.1.2")
        classpath("com.facebook.react:react-native-gradle-plugin:0.80.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

// Disable Prefab globally to prevent native builds in node_modules
// Add this to gradle.properties instead (android/gradle.properties):
// ANDROID_DISABLE_PREFAB=true

apply plugin: "com.facebook.react.rootproject"
